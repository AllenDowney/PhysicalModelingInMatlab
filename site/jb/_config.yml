# Jupyter Book for Physical Modeling in MATLAB: the chapter notebooks, with outputs,
# as web pages. site/build.sh builds it into site/dist (the site root); JupyterLite is
# in site/dist/run. The notebooks here are run locally by site/run_notebooks.py.
title: Physical Modeling in MATLAB
author: Allen B. Downey
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: 'off'

repository:
  url: https://github.com/AllenDowney/PhysicalModelingInMatlab
  branch: master
html:
  baseurl: https://allendowney.github.io/PhysicalModelingInMatlab/
  use_repository_button: true

  extra_footer: |
    <div style="text-align: left;">
      Text: <a rel="license" href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>;
      code: <a href="https://opensource.org/license/MIT">MIT License</a>.
    </div>
    <script>new Image().src="https://greenteapress.com/gh.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)</script>

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
    - html_image

sphinx:
  recursive_update: true
  # Sitemap and link previews (GreenTeaPress plans/seo.md); page descriptions are in
  # descriptions.yml (notebooks) and the front matter of index.md
  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
  config:
    html_baseurl: https://allendowney.github.io/PhysicalModelingInMatlab/
    sitemap_url_scheme: "{link}"
    sitemap_excludes: [genindex.html, search.html]
    ogp_site_url: https://allendowney.github.io/PhysicalModelingInMatlab/
    ogp_site_name: Physical Modeling in MATLAB
    ogp_image: https://greenteapress.com/matlab/cover.png
    ogp_image_alt: Cover of Physical Modeling in MATLAB by Allen B. Downey
    ogp_enable_meta_description: false
    # Consecutive printed lines in one output block, not one block per line
    nb_merge_streams: true
    # End-of-chapter support note (_templates/support-ask.html, _static/support-ask.css)
    templates_path: [_templates]
    html_static_path: [_static]
    html_css_files: [support-ask.css]
    html_theme_options:
      article_footer_items: [support-ask.html]
