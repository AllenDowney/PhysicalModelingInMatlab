# Tools that build the site: JupyterLite and the Jupyter Book (run in CI, not in the browser).
name: site-build
channels:
  - conda-forge
dependencies:
  - python=3.12
  - jupyter_server
  - jupyterlite-core >=0.8
  - jupyterlite-xeus >=5.1
  - micromamba
  # The Jupyter Book
  - jupyter-book >=1.0,<2
  - sphinx-sitemap
  - sphinxext-opengraph
