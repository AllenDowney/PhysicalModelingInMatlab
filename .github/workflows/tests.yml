name: tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # monthly, to catch changes in Octave
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  tests:
    name: Chapter code in GNU Octave
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install Octave
        timeout-minutes: 10
        run: |
          # a stalled mirror once held this step for 20 minutes
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends octave gnuplot-nox fonts-freefont-otf fonts-dejavu-core ghostscript
          octave --version | head -1

      - name: Run the chapter code
        run: tests/run_tests.sh
