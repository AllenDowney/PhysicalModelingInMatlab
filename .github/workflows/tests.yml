name: tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # monthly, to catch changes in Octave
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  tests:
    name: Chapter code in GNU Octave
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install Octave
        timeout-minutes: 10
        run: |
          # a stalled mirror once held this step for 20 minutes
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends octave gnuplot-nox fonts-freefont-otf fonts-dejavu-core ghostscript
          octave --version | head -1

      - name: Run the chapter code
        run: tests/run_tests.sh

      - name: The code ZIP matches code/
        run: |
          mkdir -p "$RUNNER_TEMP/zip/committed" "$RUNNER_TEMP/zip/built"
          unzip -q PhysicalModelingInMatlab.zip -d "$RUNNER_TEMP/zip/committed"
          sh build.sh
          unzip -q PhysicalModelingInMatlab.zip -d "$RUNNER_TEMP/zip/built"
          diff -r "$RUNNER_TEMP/zip/committed" "$RUNNER_TEMP/zip/built" ||
            { echo "The ZIP is out of date: run sh build.sh and commit PhysicalModelingInMatlab.zip"; exit 1; }

  notebooks:
    # The notebooks run in the browser on Octave 10 (xeus-octave), and some error
    # messages differ in Ubuntu's Octave 8, so test them with conda-forge's Octave.
    name: Chapter notebooks in GNU Octave 10
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true

      - name: Run the chapter notebooks
        shell: bash -l {0}
        run: |
          octave --version | head -1
          python tests/test_notebooks.py

      - name: The book's notebooks with outputs (site/jb) are up to date
        shell: bash -l {0}
        run: python site/run_notebooks.py --check
